name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Godot templates and Android SDK settings
        shell: bash
        run: |
          set -euo pipefail
          echo "Godot HOME: $HOME"
          echo "Setting up export assets installed in Docker image under /root"
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config/godot" "$HOME/.android"
          cp -a /root/.local/share/godot/export_templates/4.4.1.stable "$HOME/.local/share/godot/export_templates/"
          cp /root/.config/godot/editor_settings-4.4.tres "$HOME/.config/godot/editor_settings-4.4.tres"
          cp /root/debug.keystore "$HOME/.android/debug.keystore"
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_release.apk"
          test -x /usr/lib/jvm/java-17-openjdk-amd64/bin/java
          test -d /usr/lib/android-sdk
          test -s "$HOME/.android/debug.keystore"
          grep 'export/android/java_sdk_path' "$HOME/.config/godot/editor_settings-4.4.tres"
          grep 'export/android/android_sdk_path' "$HOME/.config/godot/editor_settings-4.4.tres"
          godot --headless --version
          java -version
          ls -lh "$HOME/.local/share/godot/export_templates/4.4.1.stable/"android_*.apk

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit --verbose 2>&1 | tee godot-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|Failed to load resource' godot-import.log; then
            echo "Godot imported the project with script/resource errors"
            exit 1
          fi

      - name: Headless gameplay boot smoke test
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --quit-after 30 2>&1 | tee godot-smoke.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Invalid call\.|Invalid access to property|Failed to load script|ERROR:.*res://' godot-smoke.log; then
            echo "Game startup produced an error"
            exit 1
          fi

      - name: Run manager season, scouting, transfer, saving and UI regression tests
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/director_qa.gd 2>&1 | tee godot-game-tests.log
          grep -q "DIRECTOR QA PASSED" godot-game-tests.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Invalid call\\.|Invalid access to property|Failed to load script|ERROR:.*res://' godot-game-tests.log; then
            echo "Gameplay regression failed"
            exit 1
          fi

      - name: Build Android debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p build/android
          godot --headless --path . --verbose --export-debug "Android" build/android/TribunArena-debug.apk 2>&1 | tee godot-export.log
          test -s build/android/TribunArena-debug.apk
          ls -lh build/android/TribunArena-debug.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TribunArena-Android-APK
          path: build/android/TribunArena-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TribunArena-Build-Logs
          path: |
            godot-import.log
            godot-export.log
            godot-smoke.log
            godot-game-tests.log
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Publish public APK download
    runs-on: ubuntu-24.04
    needs: android
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download APK from successful build
        uses: actions/download-artifact@v4
        with:
          name: TribunArena-Android-APK
          path: release
      - name: Validate APK before release
        shell: bash
        run: |
          test -s release/TribunArena-debug.apk
          file release/TribunArena-debug.apk
          sha256sum release/TribunArena-debug.apk
      - name: Publish or update alpha release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0-alpha
          name: Tribun Arena Director - Android Alpha 0.3
          body: "Original offline football management alpha. 12 fictional clubs, 22-round league, 260+ footballers, tactical in/out of possession shapes, scouting, transfers, contracts, finances, staff, academy, training, half-time match simulation and local saves. PC-depth-inspired development build, not the Football Manager game. Debug-signed Android APK."
          prerelease: true
          make_latest: false
          files: release/TribunArena-debug.apk
          fail_on_unmatched_files: true
